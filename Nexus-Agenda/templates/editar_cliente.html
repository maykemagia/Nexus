
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | Editar cliente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <aside class="sidebar">
        <h1>NEXUS</h1>
        <p class="subtitle">NEXUS Agenda</p>

        <nav>
            <a href="/">Painel inicial</a>
            <a href="/clientes" class="active">Clientes</a>
            <a href="/servicos">Serviços</a>
            <a href="/agendamentos">Agendamentos</a>
        </nav>
    </aside>

    <main>
        <header class="topbar">
            <div>
                <h2>Editar cliente</h2>
                <p>Altere os dados do cliente selecionado.</p>
            </div>
        </header>

        <section class="welcome">
            <form
                action="{{ url_for('editar_cliente', id_cliente=cliente[0]) }}"
                method="POST"
                class="service-form"
            >
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="{{ cliente[1] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        value="{{ cliente[2] }}"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary">
                    Salvar alterações
                </button>

                <a href="/clientes" class="btn-editar">
                    Cancelar
                </a>
            </form>
        </section>
    </main>
       <footer class="footer"> Nexus Agenda | Desenvolvido por Mayke. </footer>
</body>
</html>
