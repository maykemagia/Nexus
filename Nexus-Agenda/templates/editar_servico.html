<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar serviço | NEXUS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <aside class="sidebar">
        <h1>NEXUS</h1>
        <p class="subtitle">NEXUS Agenda</p>
        <nav>
            <a href="/">Painel inicial</a>
            <a href="/clientes">Clientes</a>
            <a href="/servicos" class="active">Serviços</a>
            <a href="/agendamentos">Agendamentos</a>
        </nav>
    </aside>

    <main>
        <header class="topbar">
            <div>
                <h2>Editar serviço</h2>
                <p>Atualize os dados do serviço.</p>
            </div>
        </header>

        <section class="welcome">
            <form method="POST"
                  action="{{ url_for('editar_servico', id_servico=servico[0]) }}"
                  class="service-form">

                <div class="form-group">
                    <label for="nome">Nome do serviço</label>
                    <input type="text" id="nome" name="nome"
                           value="{{ servico[1] }}" required>
                </div>

                <div class="form-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" name="preco"
                           value="{{ servico[2] }}" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="duracao_minutos">Duração (minutos)</label>
                    <input type="number" id="duracao_minutos"
                           name="duracao_minutos"
                           value="{{ servico[3] }}" min="1" required>
                </div>

                <button type="submit" class="btn-primary">
                    Salvar alterações
                </button>

                <a href="/servicos" class="btn-editar">Cancelar</a>
            </form>
        </section>
    </main>
       <footer class="footer"> Nexus Agenda | Desenvolvido por Mayke. </footer>
</body>
</html>
