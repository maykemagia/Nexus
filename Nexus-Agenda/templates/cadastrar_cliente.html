<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS | Cadastrar cliente</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <aside class="sidebar">
        <h1>NEXUS</h1>
        <p class="subtitle">NEXUS Agenda</p>

        <nav>
            <a href="/">Painel inicial</a>
            <a href="/clientes" class="active">Clientes</a>
            <a href="/servicos">Serviços</a>
            <a href="/agendamentos">Agendamentos</a>
        </nav>
    </aside>

    <main>

        <header class="topbar">
            <div>
                <h2>Cadastrar cliente</h2>
                <p>Adicione um novo cliente ao NEXUS.</p>
            </div>
        </header>

        <section class="agendamentos-card cadastro-cliente-card">

            <h2>Dados do cliente</h2>

            <form method="POST" class="agendamentos-form cadastro-cliente-form">

                <div class="campo">
                    <label for="nome">Nome do cliente</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome completo"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(41) 99999-9999"
                        required
                    >
                </div>

                <div class="acoes-formulario">

                    <button type="submit" class="btn-nexus">
                        Salvar cliente
                    </button>

                    <a href="/clientes" class="btn-secundario">
                        Cancelar
                    </a>

                </div>

            </form>

        </section>

    </main>
       <footer class="footer"> Nexus Agenda | Desenvolvido por Mayke. </footer>
</body>
</html>
